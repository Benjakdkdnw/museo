<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museo de los Recuerdos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --soul: #ff0000;
    --gold: #ffd93b;
    --dim: #9a9a9a;
    --font: 'Press Start 2P', 'Courier New', Courier, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --fg: #ffffff; } }
  :root[data-theme="dark"] { --bg: #000000; --fg: #ffffff; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--font);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 8px 24px;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  #game { position: relative; width: 100%; max-width: 640px; }
  #hud {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    font-size: 10px; line-height: 1.6; padding: 6px 4px;
  }
  #hud .bar { display: inline-block; width: 78px; height: 10px; background: #a80000; position: relative; vertical-align: middle; }
  #hud .bar i { position: absolute; inset: 0; background: var(--gold); }
  #hud .rooms { margin-left: auto; color: var(--dim); }

  #c {
    display: block; width: 100%; height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; border: 3px solid var(--fg);
  }

  #banner {
    position: absolute; left: 0; right: 0; top: 46px;
    text-align: center; font-size: 12px; line-height: 1.6;
    text-shadow: 2px 2px 0 #000;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  #banner.show { opacity: 1; }

  #big {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.92); text-align: center; padding: 16px;
  }
  #big[hidden] { display: none; }
  #big span {
    display: inline-block; font-size: 30px; color: #ff4d6d; text-shadow: 3px 3px 0 #5a0014;
    animation: fl 1.1s ease-in-out infinite;
  }
  @keyframes fl { 0%, 100% { transform: translateY(-8px); } 50% { transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { #big span { animation: none; } }
  @media (max-width: 480px) { #big span { font-size: 18px; } }

  #fade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #fade.on { opacity: 1; }

  #photo {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    width: 44%; aspect-ratio: 4 / 3; max-width: 280px;
    background: #000; border: 4px solid var(--fg); padding: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--fg); text-align: center; line-height: 1.8;
  }
  #photo[hidden] { display: none; }
  #photo.solo {
    top: 50%; width: 82%; max-width: 420px; aspect-ratio: auto;
    height: 86%; padding: 8px; background: #000;
  }
  #photo.solo .ph { height: 100%; }
  #photo.solo img { object-fit: contain; }
  #photo .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; image-rendering: auto; }
  #photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  #dlg {
    position: absolute; left: 4%; right: 4%; bottom: 4%;
    background: #000; border: 4px solid var(--fg);
    padding: 14px 16px 16px;
    display: flex; gap: 14px; align-items: flex-start;
    min-height: 126px; font-size: 12px; line-height: 1.9;
  }
  #dlg[hidden] { display: none; }
  #pc { width: 72px; height: 72px; flex: none; image-rendering: pixelated; }
  #pc[hidden] { display: none; }
  #txt { white-space: pre-wrap; flex: 1; min-height: 60px; }
  #txt[hidden] { display: none; }
  #ch { display: none; grid-template-columns: 1fr 1fr; gap: 8px 22px; flex: 1; padding-top: 4px; }
  #ch.on { display: grid; }
  #ch div { padding-left: 22px; position: relative; color: var(--gold); }
  #ch div.sel::before {
    content: ''; position: absolute; left: 0; top: 4px; width: 14px; height: 14px; background: var(--soul);
    clip-path: polygon(50% 100%, 0 45%, 0 15%, 25% 0, 50% 22%, 75% 0, 100% 15%, 100% 45%);
  }
  #arrow { position: absolute; right: 16px; bottom: 8px; font-size: 10px; color: var(--soul); animation: bob .7s steps(2) infinite; }
  #arrow[hidden] { display: none; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { #arrow { animation: none; } }

  #title {
    position: absolute; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 22px; padding: 20px;
  }
  #title[hidden] { display: none; }
  #title h1 { font-size: 18px; line-height: 1.8; margin: 0; font-weight: normal; }
  #menu { display: flex; flex-direction: column; gap: 14px; font-size: 12px; text-align: left; }
  #menu .mi { position: relative; padding-left: 26px; cursor: pointer; color: var(--dim); }
  #menu .mi.sel { color: var(--fg); }
  #menu .mi.sel::before {
    content: ''; position: absolute; left: 0; top: 0; width: 14px; height: 14px; background: var(--soul);
    clip-path: polygon(50% 100%, 0 45%, 0 15%, 25% 0, 50% 22%, 75% 0, 100% 15%, 100% 45%);
  }
  #controls[hidden] { display: none; }
  #title .heart { width: 40px; height: 40px; image-rendering: pixelated; }
  #title p { font-size: 10px; line-height: 2; margin: 0; color: var(--dim); }
  #title .blink { color: var(--fg); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #title button { font-family: inherit; font-size: 11px; background: #000; color: var(--fg); border: 3px solid var(--fg); padding: 10px 16px; cursor: pointer; }
  #title button:focus-visible, #mute:focus-visible, #pad button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  #musicBtn, #mute { font-family: inherit; font-size: 10px; background: #000; color: var(--fg); border: 2px solid var(--fg); padding: 6px 8px; cursor: pointer; margin-top: 10px; }

  #pad { display: none; width: 100%; max-width: 640px; margin-top: 14px; justify-content: space-between; align-items: center; gap: 12px; }
  @media (hover: none), (max-width: 700px) { #pad { display: flex; } }
  #dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
  #pad button { font-family: inherit; font-size: 12px; background: #000; color: var(--fg); border: 3px solid var(--fg); cursor: pointer; touch-action: none; border-radius: 0; }
  #pad button:active { background: var(--fg); color: #000; }
  #dpad button:nth-child(1) { grid-column: 2; grid-row: 1; }
  #dpad button:nth-child(2) { grid-column: 1; grid-row: 2; }
  #dpad button:nth-child(3) { grid-column: 3; grid-row: 2; }
  #dpad button:nth-child(4) { grid-column: 2; grid-row: 3; }
  #act { display: flex; gap: 12px; }
  #act button { width: 66px; height: 66px; font-size: 14px; }
  #act button.z { border-color: var(--soul); }

  @media (max-width: 480px) {
    #dlg { font-size: 10px; padding: 10px 12px 12px; min-height: 100px; gap: 10px; }
    #pc { width: 56px; height: 56px; }
    #banner { font-size: 10px; top: 40px; }
    #hud { font-size: 8px; gap: 10px; }
    #title h1 { font-size: 14px; }
    #photo { top: 40%; width: 56%; }
  }
</style>
</head>
<body>

<div id="game">
  <div id="hud">
    <span id="hudName">CATA</span>
    <span>LV 1</span>
    <span>LOVE <span class="bar"><i></i></span> 99/99</span>
    <span id="hudItem"></span>
    <span class="rooms" id="hudRooms">Salas 0/3</span>
  </div>
  <canvas id="c" width="672" height="416" aria-label="Museo de los Recuerdos, mapa del juego"></canvas>
  <div id="banner"></div>
  <div id="photo" hidden><div class="ph" id="photoBox"></div></div>
  <div id="dlg" hidden role="dialog" aria-live="polite">
    <canvas id="pc" width="96" height="96" hidden></canvas>
    <div id="txt"></div>
    <div id="ch"></div>
    <span id="arrow" hidden>▼</span>
  </div>
  <div id="big" hidden aria-label="Te amo muchooo"></div>
  <div id="fade"></div>
  <div id="title">
    <canvas class="heart" id="th" width="8" height="8"></canvas>
    <h1>MUSEO DE LOS<br>RECUERDOS</h1>
    <p>para Cata, de Benja<br>Un año entero, sala por sala.</p>
    <div id="menu" role="menu">
      <div class="mi sel" data-m="start" role="menuitem">Empezar la visita</div>
      <div class="mi" data-m="controls" role="menuitem">Controles</div>
      <div class="mi" data-m="music" role="menuitem">Música: ON</div>
    </div>
    <p id="controls" hidden>Flechas o WASD: moverse<br>Z / Enter: interactuar<br>X: saltar texto</p>
  </div>
</div>

<div id="pad" aria-label="Controles táctiles">
  <div id="dpad">
    <button type="button" data-k="up" aria-label="Arriba">▲</button>
    <button type="button" data-k="left" aria-label="Izquierda">◀</button>
    <button type="button" data-k="right" aria-label="Derecha">▶</button>
    <button type="button" data-k="down" aria-label="Abajo">▼</button>
  </div>
  <div id="act">
    <button type="button" class="x" data-a="cancel" aria-label="Cancelar">X</button>
    <button type="button" class="z" data-a="confirm" aria-label="Confirmar">Z</button>
  </div>
</div>
<div>
  <button id="mute" type="button" aria-pressed="false">Sonido: ON</button>
  <button id="musicBtn" type="button" aria-pressed="false">Música: ON</button>
</div>

      bigEl.appendChild(s);
    }
    bigEl.hidden = false;
  }

  function showPage() {
    var p = dq[dIdx];
    if (p.photo && p.t === undefined) {
      dlg.hidden = true; bigEl.hidden = true;
      photoEl.classList.add('solo');
      showPhoto(p.photo);
      typing = false;
      return;
    }
    photoEl.classList.remove('solo');
    if (p.big) {
      dlg.hidden = true; photoEl.hidden = true;
      showBig(p.big);
      jingle();
      typing = false;
      return;
    }
    bigEl.hidden = true;
    dlg.hidden = false;
    pcEl.hidden = !p.face;
    if (p.face) { pctx.clearRect(0, 0, 96, 96); drawSprite(pctx, SPR.cat, 6, 3, 6); }
    showPhoto(p.photo);
    chEl.classList.remove('on'); chEl.innerHTML = '';
    txtEl.hidden = false;
    arrowEl.hidden = true;
    full = p.t; shown = 0; typing = true;
    txtEl.textContent = '';
    clearInterval(typeTimer);
    typeTimer = setInterval(function () {
      shown++;
      txtEl.textContent = full.slice(0, shown);
      var ch = full[shown - 1];
      if (ch && ch !== ' ' && ch !== '\n' && shown % 2 === 0) beep(p.face ? 440 : 560, 0.03, 'square', 0.025);
      if (shown >= full.length) finishPage();
    }, 32);
  }
  function finishPage() {
    clearInterval(typeTimer); typing = false;
    txtEl.textContent = full; arrowEl.hidden = false;
  }
  function closeDialog() {
    dlg.hidden = true; arrowEl.hidden = true; photoEl.hidden = true; bigEl.hidden = true;
    photoEl.classList.remove('solo');
    chEl.classList.remove('on');
    state = 'play';
    var cb = onEnd; onEnd = null;
    if (cb) cb();
  }
  function openChoice(opts, cb) {
    choice = { opts: opts, sel: 0, cb: cb };
    state = 'dialog';
    dlg.hidden = false;
    pcEl.hidden = true; txtEl.hidden = true; arrowEl.hidden = true;
    chEl.innerHTML = '';
    opts.forEach(function (o) { var d = document.createElement('div'); d.textContent = o; chEl.appendChild(d); });
    chEl.classList.add('on');
    renderChoice();
  }
  function renderChoice() {
    var nodes = chEl.children;
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('sel', i === choice.sel);
  }
  function moveChoice(dx, dy) {
    var n = choice.opts.length, s = choice.sel;
    if (dx) s = (s % 2 === 0) ? s + 1 : s - 1;
    if (dy) s = (s + 2) % n;
    if (s >= 0 && s < n) { choice.sel = s; renderChoice(); beep(700, 0.03, 'square', 0.03); }
  }

  function confirm() {
    if (state === 'title') { menuActivate(); return; }
    if (state !== 'dialog') { if (state === 'play') interact(); return; }
    if (choice) {
      var c = choice; choice = null;
      chEl.classList.remove('on'); txtEl.hidden = false;
      beep(900, 0.05, 'square', 0.04);
      c.cb(c.opts[c.sel]);
      return;
    }
    if (typing) { finishPage(); return; }
    dIdx++;
    if (dIdx < dq.length) showPage(); else closeDialog();
  }
  function cancel() {
    if (state === 'dialog' && !choice && typing) finishPage();
  }

  // ---------- Interaction ----------
  function facingTile() {
    var tx = Math.floor((player.x + player.dx * T) / T);
    var ty = Math.floor((player.y + player.dy * T) / T);
    return { tx: tx, ty: ty, ch: tileAt(tx, ty) };
  }
  function findTile(ch) {
    for (var ty = 0; ty < ROWS; ty++) for (var tx = 0; tx < COLS; tx++) if (room.map[ty][tx] === ch) return { tx: tx, ty: ty };
    return null;
  }
  function interact() {
    var here = tileAt(Math.floor(player.x / T), Math.floor(player.y / T));
    if (here === 'S') { savePoint(); return; }
    var f = facingTile();
    var ch = f.ch;
    if (ch === 'S') { savePoint(); return; }
    if (ch === 'N') { talkToCat(); return; }
    if (ch === '=') { openDialog(room.shelf || ['* Un estante lleno de cosas.']); return; }
    if (ch === 'L') {
      openDialog(['* La puerta está cerrada.', '* Parece que se abre cuando\n  hayas recorrido todas las salas.']);
      return;
    }
    if (isExhibit(ch)) {
      var ex = exhibitFor(ch);
      if (!ex || (!ex.pages && ex.kind !== 'vitrina')) return;
      if (ex.kind === 'vitrina') {
        if (coyacPlaced) { openDialog(['* Vitrina: "Coyac original".', '* (Ahí está. Intacto.)']); }
        else if (inventory.Coyac) {
          jingle();
          openDialog(['* Una vitrina vacía.\n* La placa dice: "Coyac original".', '* (Pusiste el Coyac adentro.)', '* Ahora es una exhibición\n  permanente.'],
            function () { coyacPlaced = true; inventory.Coyac = false; hudItem.textContent = ''; });
        } else { openDialog(['* Una vitrina vacía.\n* La placa dice: "Coyac original".', '* (Falta algo.)']); }
        return;
      }
      if (ex.kind === 'bench') {
        var b = findTile('W');
        sitting = { x: b.tx * T + T, y: b.ty * T + 8 };
        beep(420, 0.08, 'triangle', 0.04);
        openDialog(ex.pages, function () { sitting = null; });
        return;
      }
      if (ex.sit) {
        sitting = { x: f.tx * T + T / 2, y: f.ty * T + 6 };
        beep(420, 0.08, 'triangle', 0.04);
        openDialog(ex.pages, function () { sitting = null; });
        return;
      }
      if (ex.pickup) {
        var pt = f;
        jingle();
        openDialog(ex.pages, function () {
          var row = room.map[pt.ty];
          room.map[pt.ty] = row.substring(0, pt.tx) + '.' + row.substring(pt.tx + 1);
          inventory[ex.pickup] = true;
          hudItem.textContent = 'ITEM: ' + ex.pickup;
        });
        return;
      }
      if (ex.kind === 'book') beep(500, 0.08, 'triangle', 0.04);
      openDialog(ex.pages);
    }
  }
  function savePoint() {
    jingle();
    openDialog(room.save || ['* (Te llenas de DETERMINACIÓN.)']);
  }
  var catSeen = {};
  function talkToCat() {
    var first = !catSeen[roomId];
    catSeen[roomId] = true;
    if (roomId === 'secreta') {
      openDialog(inventory.Coyac ? CAT_LINES.secret.concat(CAT_LINES.coyac) : CAT_LINES.secret);
      return;
    }
    if (roomId !== 'entrada') { openDialog(CAT_LINES[roomId]); return; }
    if (first) { openDialog(CAT_LINES.intro); return; }
    openChoice(['HABLAR', 'MIRAR', 'ABRAZAR', 'PIEDAD'], function (opt) {
      var lines = CAT_LINES[opt];
      if (opt === 'HABLAR' && unlocked) lines = CAT_LINES.done;
      openDialog(lines);
    });
  }

  // ---------- Rooms & transitions ----------
  function countVisited() {
    var n = 0; ['comienzos', 'fotos', 'cartas'].forEach(function (r) { if (visited[r]) n++; });
    return n;
  }
  function updateHud() { hudRooms.textContent = 'Salas ' + countVisited() + '/3'; }

  function showBanner(text) {
    bannerEl.textContent = text;
    bannerEl.classList.add('show');
    clearTimeout(showBanner.t);
    showBanner.t = setTimeout(function () { bannerEl.classList.remove('show'); }, 1800);
  }

  function goToRoom(id, tx, ty) {
    state = 'transition';
    beep(300, 0.12, 'triangle', 0.05);
    fadeEl.classList.add('on');
    setTimeout(function () {
      roomId = id; room = ROOMS[id];
      player.x = tx * T + T / 2; player.y = ty * T + T / 2;
      var newlyAll = false;
      if (!visited[id]) {
        visited[id] = true;
        if (countVisited() === 3 && !unlocked) { unlocked = true; newlyAll = true; }
      }
      updateHud();
      draw();
      fadeEl.classList.remove('on');
      showBanner(room.name);
      setTimeout(function () {
        state = 'play';
        if (newlyAll) openDialog(['* Escuchaste un "clic" lejano.', '* Se abrió una puerta en\n  la Entrada del Museo.']);
      }, 320);
    }, 320);
  }

  var menuSel = 0;
  var menuItems = document.querySelectorAll('#menu .mi');
  function renderMenu() { for (var i = 0; i < menuItems.length; i++) menuItems[i].classList.toggle('sel', i === menuSel); }
  function menuMove(d) { menuSel = (menuSel + d + menuItems.length) % menuItems.length; renderMenu(); beep(700, 0.03, 'square', 0.03); }
  function menuActivate() {
    var m = menuItems[menuSel].getAttribute('data-m');
    if (m === 'start') startGame();
    else if (m === 'controls') { var c = document.getElementById('controls'); c.hidden = !c.hidden; beep(600, 0.04, 'square', 0.03); }
    else if (m === 'music') { setMusic(!musicOn); beep(600, 0.04, 'square', 0.03); }
  }
  Array.prototype.forEach.call(menuItems, function (el, i) {
    el.addEventListener('click', function () { if (state !== 'title') return; menuSel = i; renderMenu(); menuActivate(); });
  });

  function startGame() {
    titleEl.hidden = true;
    beep(880, 0.08, 'square', 0.05);
    musicStart();
    state = 'play';
    updateHud();
    showBanner(room.name);
    setTimeout(function () {
      openDialog(['* Bienvenido al Museo de\n  los Recuerdos.', '* (Un gato te mira desde\n  el centro de la sala.)']);
    }, 400);
  }

  // ---------- Update ----------
  function update() {
    if (state !== 'play') return;
    var mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    var my = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (!mx && !my) return;
    var spd = 2.6;
    if (mx && my) spd *= 0.72;
    var nx = player.x + mx * spd, ny = player.y + my * spd;
    if (!boxCollides(nx, player.y)) player.x = nx;
    if (!boxCollides(player.x, ny)) player.y = ny;
    player.dx = mx; player.dy = my; player.step++;
    if (mx && my) { player.dy = 0; }

    var tx = Math.floor(player.x / T), ty = Math.floor(player.y / T);
    var ch = tileAt(tx, ty);
    if (isDoor(ch) && room.doors[ch]) {
      var d = room.doors[ch];
      goToRoom(d.to, d.x, d.y);
    } else if (ch === 'L' && unlocked && room.locked) {
      goToRoom(room.locked.to, room.locked.x, room.locked.y);
    }
  }

  // ---------- Drawing ----------
  function carpetAt(tx, ty) {
    if (!room.carpets) return false;
    for (var i = 0; i < room.carpets.length; i++) {
      var c = room.carpets[i];
      if (tx >= c.x0 && tx <= c.x1 && ty >= c.y0 && ty <= c.y1) return true;
    }
    return false;
  }

  function drawFloor(tx, ty, ch) {
    var x = tx * T, y = ty * T;
    if (ch === '~') {
      ctx.fillStyle = '#3a3a3f'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#5a4a3a'; for (var s = 0; s < 4; s++) ctx.fillRect(x + s * 8 + 2, y + 6, 4, 20);
      ctx.fillStyle = '#9a9aa5'; ctx.fillRect(x, y + 9, T, 3); ctx.fillRect(x, y + 21, T, 3);
      return;
    }
    if (ch === ':') {
      ctx.fillStyle = '#a07a4a'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#8a6538'; ctx.fillRect(x + ((tx * 7) % 20), y + ((ty * 11) % 22), 5, 3); ctx.fillRect(x + ((tx * 13 + 9) % 24), y + ((ty * 5 + 14) % 26), 3, 3);
      return;
    }
    var alt = room.pattern === 'stripes' ? (tx % 2 === 0) : ((tx + ty) % 2 === 0);
    ctx.fillStyle = alt ? room.floor : room.floor2;
    ctx.fillRect(x, y, T, T);
    if (room.rug && tx >= room.rug.x0 && tx <= room.rug.x1 && ty >= room.rug.y0 && ty <= room.rug.y1) {
      ctx.fillStyle = '#6a4f43'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#a5866a';
      if (tx === room.rug.x0) ctx.fillRect(x, y, 3, T);
      if (tx === room.rug.x1) ctx.fillRect(x + T - 3, y, 3, T);
      if (ty === room.rug.y0) ctx.fillRect(x, y, T, 3);
      if (ty === room.rug.y1) ctx.fillRect(x, y + T - 3, T, 3);
      ctx.fillStyle = 'rgba(201,154,91,.3)'; ctx.fillRect(x + 12, y + 12, 8, 8);
    }
    if (carpetAt(tx, ty)) {
      var up = carpetAt(tx, ty - 1), dn = carpetAt(tx, ty + 1), lf = carpetAt(tx - 1, ty), rt = carpetAt(tx + 1, ty);
      ctx.fillStyle = '#7a4b55';
      ctx.fillRect(x + 3, y + 3, T - 6, T - 6);
      if (up) ctx.fillRect(x + 3, y, T - 6, 3);
      if (dn) ctx.fillRect(x + 3, y + T - 3, T - 6, 3);
      if (lf) ctx.fillRect(x, y + 3, 3, T - 6);
      if (rt) ctx.fillRect(x + T - 3, y + 3, 3, T - 6);
      ctx.fillStyle = '#c2a074';
      if (!up) ctx.fillRect(x + 3, y + 3, T - 6, 2);
      if (!dn) ctx.fillRect(x + 3, y + T - 5, T - 6, 2);
      if (!lf) ctx.fillRect(x + 3, y + 3, 2, T - 6);
      if (!rt) ctx.fillRect(x + T - 5, y + 3, 2, T - 6);
      if (up && lf) ctx.fillStyle = '#8c1d2b';
    }
    if (tileAt(tx, ty - 1) === '~') {
      ctx.fillStyle = '#e6c22e'; ctx.fillRect(x, y + 2, T, 4);
      ctx.fillStyle = '#777'; for (var d = 0; d < 4; d++) ctx.fillRect(x + d * 8 + 3, y + 9, 2, 2);
    }
  }

  function drawTrain() {
    var x0 = 1 * T, x1 = 20 * T, y = T + 2, h = 2 * T - 6;
    ctx.fillStyle = '#141820'; ctx.fillRect(x0 - 2, y + h - 3, x1 - x0 + 4, 5);
    ctx.fillStyle = '#f4f6f8'; ctx.fillRect(x0, y, x1 - x0, h);
    ctx.fillStyle = '#e03e3e'; ctx.fillRect(x0, y + h - 16, x1 - x0, 7);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x0, y + h - 9, x1 - x0, 3);
    for (var i = 0; i < 13; i++) {
      var wx = x0 + 14 + i * 46;
      if (i % 3 === 1) {
        ctx.fillStyle = '#c9d2da'; ctx.fillRect(wx - 3, y + 4, 30, h - 10);
        ctx.fillStyle = '#2f7fb8'; ctx.fillRect(wx + 1, y + 9, 10, 18); ctx.fillRect(wx + 13, y + 9, 10, 18);
      } else {
        ctx.fillStyle = '#2f7fb8'; ctx.fillRect(wx, y + 9, 28, 19);
        ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(wx + 2, y + 11, 24, 5);
      }
    }
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x0, y, x1 - x0, 4);
    ctx.fillStyle = '#9aa6b2'; ctx.fillRect(x0, y + 4, x1 - x0, 2);
  }

  function drawSign(text) {
    var w = 150, x = (cv.width - w) / 2;
    ctx.fillStyle = '#20408c'; ctx.fillRect(x, 3, w, 26);
    ctx.fillStyle = '#e6c22e'; ctx.fillRect(x, 3, w, 3);
    ctx.fillStyle = '#fff'; ctx.font = '10px "Press Start 2P", monospace';
    ctx.textAlign = 'center'; ctx.fillText(text, cv.width / 2, 22); ctx.textAlign = 'left';
  }

  function drawWall(tx, ty, ch) {
    var x = tx * T, y = ty * T;
    ctx.fillStyle = room.wall; ctx.fillRect(x, y, T, T);
    var below = tileAt(tx, ty + 1);
    if (below !== '#' && ty < ROWS - 1) { ctx.fillStyle = room.wallTop; ctx.fillRect(x, y + T - 6, T, 6); }
    if (ch === 'L') {
      ctx.fillStyle = '#000'; ctx.fillRect(x + 6, y + 4, T - 12, T - 4);
      ctx.fillStyle = room.wallTop; ctx.fillRect(x + 6, y + 4, T - 12, 3);
      ctx.fillStyle = '#ffd93b'; ctx.fillRect(x + 14, y + 16, 4, 6);
    }
  }

  function drawDoor(tx, ty) {
    var x = tx * T, y = ty * T;
    ctx.fillStyle = '#000'; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = room.wallTop;
    if (ty === 0 || ty === ROWS - 1) { ctx.fillRect(x, y, 3, T); ctx.fillRect(x + T - 3, y, 3, T); }
    else { ctx.fillRect(x, y, T, 3); ctx.fillRect(x, y + T - 3, T, 3); }
  }

  function drawShelf(tx, ty) {
    var x = tx * T, y = ty * T;
    ctx.fillStyle = '#4a3320'; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#2d1e12'; ctx.fillRect(x, y + 10, T, 2); ctx.fillRect(x, y + 21, T, 2); ctx.fillRect(x, y + T - 2, T, 2);
    var cols = ['#c94f4f', '#4f8fc9', '#c9b34f', '#6fc95a', '#b06fc9'];
    for (var i = 0; i < 4; i++) {
      ctx.fillStyle = cols[(tx * 3 + i + ty) % cols.length]; ctx.fillRect(x + 2 + i * 7, y + 2, 5, 8);
      ctx.fillStyle = cols[(tx * 5 + i + ty * 2) % cols.length]; ctx.fillRect(x + 2 + i * 7, y + 13, 5, 8);
    }
  }

  function drawObject(tx, ty, ex) {
    var x = tx * T, y = ty * T;

      case 'none': case 'benchR': return;

        ctx.fillStyle = '#6b5a3a'; ctx.fillRect(x + 14, y + 14, 4, 16);
        ctx.fillStyle = '#e8dcb5'; ctx.fillRect(x + 4, y + 2, T - 8, 16);
        ctx.fillStyle = '#6b5a3a'; ctx.fillRect(x + 4, y + 2, T - 8, 2); ctx.fillRect(x + 4, y + 16, T - 8, 2);
        drawSprite(ctx, SPR.map, x + 12, y + 4, 1);
        return;
      case 'case':
        ctx.fillStyle = '#5b5b66'; ctx.fillRect(x + 6, y + 18, T - 12, 12);
        ctx.fillStyle = '#3d3d47'; ctx.fillRect(x + 6, y + 28, T - 12, 2);
        if (SPR[ex.icon]) drawSprite(ctx, SPR[ex.icon], x + 8, y + 2, 2);
        ctx.fillStyle = 'rgba(160,220,255,.22)'; ctx.fillRect(x + 4, y, T - 8, 20);
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + 6, y + 2, 2, 12);
        return;
      case 'jar':
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 6, y + 26, T - 12, 4);
        drawSprite(ctx, SPR.jar, x + 4, y + 2, 3);
        return;
      case 'desk':
        ctx.fillStyle = '#7a5230'; ctx.fillRect(x, y + 8, T, 16);
        ctx.fillStyle = '#4a3320'; ctx.fillRect(x + 2, y + 24, 5, 8); ctx.fillRect(x + T - 7, y + 24, 5, 8);
        drawSprite(ctx, SPR.letter, x + 8, y + 6, 2);
        return;
      case 'bench': {
        var w = T * 2, wood = '#a9743f', dark = '#6e4726';
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 2, y + 24, w - 4, 6);
        ctx.fillStyle = dark; ctx.fillRect(x + 4, y + 2, 4, 26); ctx.fillRect(x + w - 8, y + 2, 4, 26);
        ctx.fillStyle = wood; ctx.fillRect(x + 2, y + 2, w - 4, 4); ctx.fillRect(x + 2, y + 8, w - 4, 4);
        ctx.fillStyle = wood; ctx.fillRect(x, y + 15, w, 5); ctx.fillRect(x, y + 21, w, 4);
        ctx.fillStyle = dark; ctx.fillRect(x, y + 20, w, 1);
        ctx.fillStyle = '#3b3b3b'; ctx.fillRect(x + 6, y + 25, 3, 6); ctx.fillRect(x + w - 9, y + 25, 3, 6);
        return;
      }
      case 'mbench': {

        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 2, y + 24, mw - 4, 5);

        ctx.fillStyle = '#7d1f16'; ctx.fillRect(x + 2, y + 21, mw - 4, 1);
        ctx.fillStyle = '#444'; ctx.fillRect(x + 6, y + 22, 3, 6); ctx.fillRect(x + mw - 9, y + 22, 3, 6); ctx.fillRect(x + mw / 2 - 1, y + 22, 3, 6);
        return;
      }
      case 'pillar':
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 4, y + 26, T - 8, 5);
        ctx.fillStyle = '#9a9aa8'; ctx.fillRect(x + 8, y - 20, 16, 50);
        ctx.fillStyle = '#c8c8d4'; ctx.fillRect(x + 8, y - 20, 5, 50);
        ctx.fillStyle = '#6a6a78'; ctx.fillRect(x + 19, y - 20, 5, 50);
        ctx.fillStyle = '#b0b0bc'; ctx.fillRect(x + 5, y - 24, 22, 5); ctx.fillRect(x + 5, y + 27, 22, 4);
        return;
      case 'rope': {
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 11, y + 26, 10, 4);
        ctx.fillStyle = '#6a6a78'; ctx.fillRect(x + 13, y + 4, 6, 24);
        ctx.fillStyle = '#d4a53a'; ctx.fillRect(x + 11, y, 10, 6);
        ctx.fillStyle = '#8c1d2b';
        if (tileAt(tx + 1, ty) === 'E') { ctx.fillRect(x + 21, y + 6, 11, 3); ctx.fillRect(x + 24, y + 8, 6, 2); }
        if (tileAt(tx - 1, ty) === 'E') { ctx.fillRect(x - 1, y + 6, 12, 3); }
        return;
      }
      case 'wbench': {
        var bw = T, wd = '#a9743f', dk = '#6e4726';
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 2, y + 24, bw - 4, 5);
        ctx.fillStyle = wd; ctx.fillRect(x + 1, y + 10, bw - 2, 6); ctx.fillRect(x + 1, y + 17, bw - 2, 5);
        ctx.fillStyle = dk; ctx.fillRect(x + 1, y + 16, bw - 2, 1);
        ctx.fillRect(x + 4, y + 22, 4, 7); ctx.fillRect(x + bw - 8, y + 22, 4, 7);
        return;

      case 'table': {
        var lf2 = tileAt(tx - 1, ty) === 'T', rt3 = tileAt(tx + 1, ty) === 'T';
        ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x, y + 22, T, 6);
        ctx.fillStyle = '#8a5a30'; ctx.fillRect(x, y + 6, T, 14);
        ctx.fillStyle = '#a9743f'; ctx.fillRect(x, y + 6, T, 4);
        ctx.fillStyle = '#5c3a1e';

  function drawPitch(p) {

    ctx.strokeRect(cx - 48, y1 - 30, 96, 30);

  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);

      ch = room.map[ty][tx];
      if (ch === '#' || (ch === 'L' && !unlocked)) drawWall(tx, ty, ch);
      else { drawFloor(tx, ty, ch); if (isDoor(ch) || ch === 'L') drawDoor(tx, ty); }

      }
      ctx.fillStyle = 'rgba(255,190,215,.35)';
      for (var hb = 0; hb < 10; hb++) {
        var bn = (hb / 10) * Math.PI * 2 + tick / 400;
        ctx.fillRect(Math.round(hx + Math.cos(bn) * (room.halo.r - 10)) - 2, Math.round(hy + Math.sin(bn) * (room.halo.r - 10) * .62) - 2, 4, 3);
      }
    }
    if (room.vines) {
      for (var vi = 0; vi < 9; vi++) {

      ctx.fillStyle = gg; ctx.fillRect(0, 0, cv.width, cv.height);

      for (var i = 0; i < 9; i++) {
        var fx = 60 + ((i * 97 + Math.floor(tick / 3) * (i % 3 + 1)) % 520);
        var fy = 60 + ((i * 53 + Math.floor(tick / 5) * ((i + 1) % 2 + 1)) % 300);
        if ((Math.floor(tick / 20) + i) % 3 === 0) { ctx.fillStyle = '#ffe98a'; ctx.fillRect(fx, fy, 2, 2); }
      }
    }
    // player soul
    var s = 3, w = 8 * s;
    if (sitting) {
      drawSprite(ctx, SPR.heart, Math.round(sitting.x - w / 2), Math.round(sitting.y), s);
    } else {
      var moving = (keys.up || keys.down || keys.left || keys.right) && state === 'play';
      var bounce = moving ? (Math.floor(player.step / 8) % 2) : 0;
      drawSprite(ctx, SPR.heart, Math.round(player.x - w / 2), Math.round(player.y - w / 2 - bounce), s);
    }
  }

  function loop() { tick++; update(); draw(); requestAnimationFrame(loop); }

  // ---------- Input ----------
  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
  };
  window.addEventListener('keydown', function (e) {
    var k = KEYMAP[e.key];
    if (k) {
      e.preventDefault();
      if (state === 'title') { if (!e.repeat && (k === 'up' || k === 'down')) menuMove(k === 'up' ? -1 : 1); return; }
      if (state === 'dialog' && choice) {
        if (!e.repeat) moveChoice(k === 'left' || k === 'right' ? 1 : 0, k === 'up' || k === 'down' ? 1 : 0);
        return;
      }
      keys[k] = true; return;
    }
    if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!e.repeat) confirm(); return; }
    if (e.key === 'x' || e.key === 'X' || e.key === 'Shift') { e.preventDefault(); cancel(); }
  });
  window.addEventListener('keyup', function (e) { var k = KEYMAP[e.key]; if (k) keys[k] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  var padBtns = document.querySelectorAll('#pad button');
  Array.prototype.forEach.call(padBtns, function (b) {
    var k = b.getAttribute('data-k'), a = b.getAttribute('data-a');
    var down = function (e) {
      e.preventDefault();
      if (k) {
        if (state === 'title') { if (k === 'up' || k === 'down') menuMove(k === 'up' ? -1 : 1); }
        else if (state === 'dialog' && choice) moveChoice(k === 'left' || k === 'right' ? 1 : 0, k === 'up' || k === 'down' ? 1 : 0);
        else keys[k] = true;
      }
      if (a === 'confirm') confirm();
      if (a === 'cancel') cancel();
    };
    var up = function (e) { e.preventDefault(); if (k) keys[k] = false; };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  cv.addEventListener('pointerdown', function () { if (state === 'dialog') confirm(); });
  dlg.addEventListener('pointerdown', function () { if (state === 'dialog' && !choice) confirm(); });
  photoEl.addEventListener('pointerdown', function () { if (state === 'dialog' && !choice) confirm(); });
  bigEl.addEventListener('pointerdown', function () { if (state === 'dialog') confirm(); });

  // ---------- Boot ----------
  drawSprite(document.getElementById('th').getContext('2d'), SPR.heart, 0, 0, 1);
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
